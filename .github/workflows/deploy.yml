name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrar D1 + desplegar Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar Worker
        run: npm run check

      - name: Tests
        run: npm test

      - name: Verificar configuración de D1
        run: |
          if grep -q 'REEMPLAZAR-con-el-id' apps/web/wrangler.jsonc; then
            echo "::error::Falta el database_id real en apps/web/wrangler.jsonc"
            exit 1
          fi

      # Primero el esquema, después el código que lo usa. Si no hay
      # migraciones pendientes, Wrangler no hace nada.
      - name: Aplicar migraciones D1
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Desplegar Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: "4.151.3"
          command: deploy
