# Optional CI/CD alternative. The primary paths are local `npm run deploy`
# (Wrangler) or Cloudflare Workers Builds connected to Git; this workflow is
# not required.
name: Deploy production

on:
  # Manual only: this workflow is an optional alternative. It will not run on
  # every push, so it cannot interfere with local Wrangler or Workers Builds.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 + deploy Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Worker
        run: npm run check

      - name: Tests
        run: npm test

      - name: Verify D1 configuration
        run: |
          if grep -q 'REEMPLAZAR-con-el-id' apps/web/wrangler.jsonc; then
            echo "::error::Missing real database_id in apps/web/wrangler.jsonc"
            exit 1
          fi

      # Schema first, then the code that uses it. If there are no pending
      # migrations, Wrangler does nothing.
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          wranglerVersion: "4.151.3"
          command: deploy
