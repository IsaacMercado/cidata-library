<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca — Editar</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/">📚 Biblioteca<small>Catálogo en línea</small></a>
    <nav><a href="/">Buscar</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta">
    <h1>Editar registro</h1>
    <p class="subtitulo">Solo usuarios con sesión iniciada.</p>
    <div id="notice" class="aviso" hidden></div>
    <div id="form-container"></div>
    <div class="barra-acciones">
      <button id="save-button" type="button">Guardar cambios</button>
      <a class="btn btn-secundario" id="back-link" href="#">Cancelar</a>
    </div>
  </section>
</main>
<script type="module">
import { api, buildForm, showNotice } from "/app.js";

const id = new URLSearchParams(location.search).get("id");
document.getElementById("back-link").href = "/libro?id=" + encodeURIComponent(id);

async function init() {
  let collect;
  try {
    const book = await api("/api/libros/" + encodeURIComponent(id));
    collect = buildForm(document.getElementById("form-container"), book);
  } catch (error) {
    showNotice("notice", error.message, true);
    return;
  }
  document.getElementById("save-button").addEventListener("click", async () => {
    try {
      await api("/api/libros/" + encodeURIComponent(id), {
        method: "PUT",
        body: JSON.stringify(collect()),
      });
      location.href = "/libro?id=" + encodeURIComponent(id);
    } catch (error) {
      showNotice("notice", error.status === 401
        ? "Para guardar debes iniciar sesión."
        : error.message, true);
    }
  });
}

init();
</script>
</body>
</html>
