<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca — Editar</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/">📚 Biblioteca<small>Catálogo en línea</small></a>
    <nav><a href="/">Buscar</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta">
    <h1>Editar registro</h1>
    <p class="subtitulo">Solo usuarios con sesión iniciada.</p>
    <div id="aviso" class="aviso" hidden></div>
    <div id="form"></div>
    <div class="barra-acciones">
      <button id="guardar" type="button">Guardar cambios</button>
      <a class="btn btn-secundario" id="volver" href="#">Cancelar</a>
    </div>
  </section>
</main>
<script type="module">
import { api, construirFormulario, mostrarAviso } from "/app.js";

const id = new URLSearchParams(location.search).get("id");
document.getElementById("volver").href = "/libro?id=" + encodeURIComponent(id);

async function init() {
  let recoger;
  try {
    const f = await api("/api/libros/" + encodeURIComponent(id));
    recoger = construirFormulario(document.getElementById("form"), f);
  } catch (e) {
    mostrarAviso("aviso", e.message, true);
    return;
  }
  document.getElementById("guardar").addEventListener("click", async () => {
    try {
      await api("/api/libros/" + encodeURIComponent(id), {
        method: "PUT",
        body: JSON.stringify(recoger()),
      });
      location.href = "/libro?id=" + encodeURIComponent(id);
    } catch (e) {
      mostrarAviso("aviso", e.status === 401
        ? "Para guardar debes iniciar sesión."
        : e.message, true);
    }
  });
}

init();
</script>
</body>
</html>
