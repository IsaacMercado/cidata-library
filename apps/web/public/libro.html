<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca — Ficha</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/">📚 Biblioteca<small>Catálogo en línea</small></a>
    <nav><span id="sesion"></span><a href="/">Buscar</a><a href="/nuevo">Nuevo registro</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta">
    <h1 id="titulo-ficha">Ficha del registro</h1>
    <p class="subtitulo" id="subtitulo-ficha"></p>
    <div id="aviso" class="aviso" hidden></div>
    <dl class="dl" id="ficha"></dl>
    <div class="acciones">
      <a class="btn" id="editar" href="#">Editar</a>
      <button class="peligro" id="eliminar" type="button">Eliminar</button>
      <a class="btn btn-secundario" href="/">Volver a buscar</a>
    </div>
  </section>
</main>
<script type="module">
import { actualizarSesion, CAMPOS, api, esc, mostrarAviso } from "/app.js";

const id = new URLSearchParams(location.search).get("id");
const $ = (x) => document.getElementById(x);

async function init() {
  actualizarSesion();
  $("editar").href = "/editar?id=" + encodeURIComponent(id);
  try {
    const f = await api("/api/libros/" + encodeURIComponent(id));
    $("titulo-ficha").textContent = f.titulo || `Registro ${f.id}`;
    $("subtitulo-ficha").textContent = [f.autor, f.temaOMateria].filter(Boolean).join(" · ") || `ID ${f.id}`;
    $("ficha").innerHTML = CAMPOS.map((c) =>
      `<dt>${esc(c.etiqueta)}</dt><dd>${esc(f[c.clave]) || "—"}</dd>`).join("");
  } catch (e) {
    mostrarAviso("aviso", e.message, true);
  }
  $("eliminar").addEventListener("click", async () => {
    if (!confirm(`¿Eliminar el registro ${id}?`)) return;
    try {
      await api("/api/libros/" + encodeURIComponent(id), { method: "DELETE" });
      location.href = "/";
    } catch (e) {
      mostrarAviso("aviso", e.status === 401
        ? "Para eliminar debes iniciar sesión."
        : e.message, true);
    }
  });
}

init();
</script>
</body>
</html>
