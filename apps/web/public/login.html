<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca — Entrar</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/">📚 Biblioteca<small>Catálogo en línea</small></a>
    <nav><a href="/">Buscar</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta login-card">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Necesaria para crear, editar o eliminar registros. La consulta es pública.</p>
    <div id="aviso" class="aviso" hidden></div>
    <form id="login">
      <div class="fila"><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="username" placeholder="tu@email.com"></div>
      <div class="fila"><label for="password">Contraseña</label><input id="password" type="password" name="password" required autocomplete="current-password"></div>
      <div class="barra-acciones"><button type="submit">Entrar</button></div>
    </form>
  </section>
</main>
<script type="module">
import { mostrarAviso } from "/app.js";

const next = new URLSearchParams(location.search).get("next") || "/";
document.getElementById("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const datos = Object.fromEntries(new FormData(e.target));
  const r = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datos),
  });
  if (r.ok) {
    const destino = next.startsWith("/") && !next.startsWith("//") ? next : "/";
    location.href = destino;
  } else {
    const cuerpo = await r.json().catch(() => ({}));
    mostrarAviso("aviso", cuerpo.mensaje || "No se pudo entrar.", true);
  }
});
</script>
</body>
</html>
