<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca — Nuevo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/">📚 Biblioteca<small>Catálogo en línea</small></a>
    <nav><a href="/">Buscar</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta">
    <h1>Nuevo registro</h1>
    <p class="subtitulo">Solo usuarios con sesión iniciada.</p>
    <div id="aviso" class="aviso" hidden></div>
    <div id="form"></div>
    <div class="barra-acciones">
      <button id="crear" type="button">Crear registro</button>
      <a class="btn btn-secundario" href="/">Cancelar</a>
    </div>
  </section>
</main>
<script type="module">
import { api, construirFormulario, mostrarAviso } from "/app.js";

const recoger = construirFormulario(document.getElementById("form"));
document.getElementById("crear").addEventListener("click", async () => {
  try {
    const r = await api("/api/libros", { method: "POST", body: JSON.stringify(recoger()) });
    location.href = "/libro?id=" + encodeURIComponent(r.id);
  } catch (e) {
    mostrarAviso("aviso", e.status === 401
      ? "Para crear debes iniciar sesión."
      : e.message, true);
  }
});
</script>
</body>
</html>
