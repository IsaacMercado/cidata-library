<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca — Buscar</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/">📚 Biblioteca<small>Catálogo en línea</small></a>
    <nav><span id="session"></span><a href="/" aria-current="page">Buscar</a><a href="/nuevo">Nuevo registro</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta">
    <h1>Buscar en el catálogo</h1>
    <p class="subtitulo">Búsqueda de texto completo, insensible a tildes.</p>
    <div id="notice" class="aviso" hidden></div>
    <form id="search-form" class="buscador" role="search">
      <input type="search" id="q" placeholder="Título, autor, tema, ficha… (p. ej. geofísica)" autocomplete="off">
      <button type="submit">Buscar</button>
    </form>
    <details class="filtros">
      <summary>Opciones de búsqueda</summary>
      <div class="filtros-cuerpo">
        <label class="campo-filtro">Modo
          <select id="mode" title="Modo de búsqueda">
            <option value="simple">Simple (palabras)</option>
            <option value="advanced">Avanzada (FTS5)</option>
          </select>
        </label>
        <label class="campo-filtro">Orden
          <select id="order" title="Orden">
            <option value="id">Relevancia / ID</option>
            <option value="title">Por título</option>
            <option value="author">Por autor</option>
          </select>
        </label>
      </div>
      <div class="campos-fts" id="fts-fields" title="Limitar la búsqueda a estos campos"></div>
    </details>
    <p class="ayuda">Modo avanzado: frases <code>"…"</code>, <code>AND</code> / <code>OR</code> / <code>NOT</code>, prefijos <code>term*</code> y filtros <code>{Titulo Autor} : …</code>.</p>
  </section>
  <section class="tarjeta">
    <div class="info-resultados" id="results-info" aria-live="polite"></div>
    <div class="tabla-scroll">
      <table class="resultados">
        <thead><tr><th style="width:64px">ID</th><th>Título</th><th>Autor</th><th>Tema o materia</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pie">
      <button id="prev-page" type="button" class="btn-secundario">◀ Anterior</button>
      <span class="pos" id="page-position"></span>
      <button id="next-page" type="button" class="btn-secundario">Siguiente ▶</button>
    </div>
  </section>
</main>
<script type="module">
import { updateSession, api, escapeHtml, highlightFragment, showNotice } from "/app.js";

let meta = null;
let page = 1;
let pages = 1;
let loading = false;
const $ = (id) => document.getElementById(id);

async function init() {
  updateSession();
  meta = await api("/api/meta");
  const container = $("fts-fields");
  for (const column of meta.ftsColumns) {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = column;
    checkbox.checked = true;
    label.append(checkbox, " " + column);
    container.appendChild(label);
  }
  $("search-form").addEventListener("submit", (event) => {
    event.preventDefault();
    page = 1;
    search();
  });
  $("q").addEventListener("input", () => {
    page = 1;
    search();
  });
  $("mode").addEventListener("change", () => {
    page = 1;
    search();
  });
  $("order").addEventListener("change", () => {
    page = 1;
    search();
  });
  container.addEventListener("change", () => {
    page = 1;
    search();
  });
  $("prev-page").addEventListener("click", () => {
    if (page > 1) {
      page--;
      search();
    }
  });
  $("next-page").addEventListener("click", () => {
    if (page < pages) {
      page++;
      search();
    }
  });
  search();
}

async function search() {
  if (loading) return;
  loading = true;
  const params = new URLSearchParams({
    q: $("q").value.trim(),
    mode: $("mode").value,
    order: $("order").value,
    page: String(page),
    limit: "25",
  });
  const selected = [...document.querySelectorAll("#fts-fields input:checked")].map((checkbox) => checkbox.value);
  if (selected.length !== meta.ftsColumns.length) params.set("fields", selected.join(","));
  try {
    const result = await api("/api/libros?" + params);
    pages = result.pages || 1;
    $("results-info").innerHTML = `<strong>${escapeHtml(result.total)}</strong> resultado(s)`;
    $("rows").innerHTML = result.items.length ? result.items.map((book) =>
      `<tr><td class="id-celda">${escapeHtml(book.id)}</td><td><a href="/libro?id=${escapeHtml(book.id)}">${escapeHtml(book.title) || "—"}</a>` +
      (book.fragment ? `<br><small>${highlightFragment(book.fragment)}</small>` : "") +
      `</td><td>${escapeHtml(book.author) || "—"}</td><td>${escapeHtml(book.subject) || "—"}</td></tr>`
    ).join("") : `<tr><td colspan="4"><div class="vacio">Sin resultados para esta búsqueda.</div></td></tr>`;
    $("page-position").textContent = `Página ${result.page} de ${pages}`;
    $("prev-page").disabled = result.page <= 1;
    $("next-page").disabled = result.page >= pages;
  } catch (error) {
    showNotice("notice", error.message, true);
  } finally {
    loading = false;
  }
}

init();
</script>
</body>
</html>
