<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca CIDATA — Ficha</title>
<meta name="description" content="Ficha catalográfica de un registro de la biblioteca CIDATA.">
<meta name="theme-color" content="#1e4e79">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/" aria-label="Biblioteca CIDATA — Inicio">
      <img class="marca-icono" src="/logo-mark.svg" alt="" width="64" height="38">
      <span class="marca-texto">Biblioteca<small>CIDATA · Catálogo en línea</small></span>
    </a>
    <nav><span id="session"></span><a href="/">Buscar</a><a href="/nuevo">Nuevo registro</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta">
    <h1 id="record-title">Ficha del registro</h1>
    <p class="subtitulo" id="record-subtitle"></p>
    <div id="notice" class="aviso" hidden></div>
    <dl class="dl" id="record"></dl>
    <div class="acciones">
      <a class="btn" id="edit-link" href="#">Editar</a>
      <button class="peligro" id="delete-button" type="button">Eliminar</button>
      <a class="btn btn-secundario" href="/">Volver a buscar</a>
    </div>
  </section>
</main>
<footer class="pie-pagina">
  <img src="/logo-mark.svg" alt="" width="29" height="17">
  <span><strong>CIDATA</strong> · Biblioteca — Catálogo en línea</span>
</footer>
<script type="module">
import { updateSession, FIELDS, api, escapeHtml, showNotice } from "/app.js";

const id = new URLSearchParams(location.search).get("id");
const $ = (elementId) => document.getElementById(elementId);

async function init() {
  updateSession();
  $("edit-link").href = "/editar?id=" + encodeURIComponent(id);
  try {
    const book = await api("/api/libros/" + encodeURIComponent(id));
    $("record-title").textContent = book.title || `Registro ${book.id}`;
    $("record-subtitle").textContent = [book.author, book.subject].filter(Boolean).join(" · ") || `ID ${book.id}`;
    $("record").innerHTML = FIELDS.map((field) =>
      `<dt>${escapeHtml(field.label)}</dt><dd>${escapeHtml(book[field.key]) || "—"}</dd>`).join("");
  } catch (error) {
    showNotice("notice", error.message, true);
  }
  $("delete-button").addEventListener("click", async () => {
    if (!confirm(`¿Eliminar el registro ${id}?`)) return;
    try {
      await api("/api/libros/" + encodeURIComponent(id), { method: "DELETE" });
      location.href = "/";
    } catch (error) {
      showNotice("notice", error.status === 401
        ? "Para eliminar debes iniciar sesión."
        : error.message, true);
    }
  });
}

init();
</script>
</body>
</html>
