<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca CIDATA — Entrar</title>
<meta name="description" content="Acceso al catálogo en línea de la biblioteca CIDATA.">
<meta name="theme-color" content="#1e4e79">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/" aria-label="Biblioteca CIDATA — Inicio">
      <img class="marca-icono" src="/logo-mark.svg" alt="" width="64" height="38">
      <span class="marca-texto">Biblioteca<small>CIDATA · Catálogo en línea</small></span>
    </a>
    <nav><a href="/">Buscar</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta login-card">
    <img class="login-logo" src="/logo.svg" alt="CIDATA" width="300" height="222">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Necesaria para crear, editar o eliminar registros. La consulta es pública.</p>
    <div id="notice" class="aviso" hidden></div>
    <form id="login-form">
      <div class="fila"><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="username" placeholder="tu@email.com"></div>
      <div class="fila"><label for="password">Contraseña</label><input id="password" type="password" name="password" required autocomplete="current-password"></div>
      <div class="barra-acciones"><button type="submit">Entrar</button></div>
    </form>
  </section>
</main>
<footer class="pie-pagina">
  <img src="/logo-mark.svg" alt="" width="29" height="17">
  <span><strong>CIDATA</strong> · Biblioteca — Catálogo en línea</span>
</footer>
<script type="module">
import { showNotice } from "/app.js";

const nextPath = new URLSearchParams(location.search).get("next") || "/";

document.getElementById("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  const response = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
  if (response.ok) {
    // Only redirect within this origin (prevents open redirects).
    const target = new URL(nextPath, location.origin);
    location.href = target.origin === location.origin
      ? target.pathname + target.search + target.hash
      : "/";
  } else {
    const body = await response.json().catch(() => ({}));
    showNotice("notice", body.message || "No se pudo entrar.", true);
  }
});
</script>
</body>
</html>
