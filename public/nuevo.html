<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca CIDATA — Nuevo registro</title>
<meta name="description" content="Alta de un nuevo registro en el catálogo de la biblioteca CIDATA.">
<meta name="theme-color" content="#1e4e79">
<link rel="icon" href="/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="marca" href="/" aria-label="Biblioteca CIDATA — Inicio">
      <img class="marca-icono" src="/logo-mark.svg" alt="" width="64" height="38">
      <span class="marca-texto">Biblioteca<small>CIDATA · Catálogo en línea</small></span>
    </a>
    <nav><a href="/">Buscar</a></nav>
  </div>
</header>
<main class="wrap">
  <section class="tarjeta">
    <h1>Nuevo registro</h1>
    <p class="subtitulo">Solo usuarios con sesión iniciada.</p>
    <div id="notice" class="aviso" hidden></div>
    <div id="form-container"></div>
    <div class="barra-acciones">
      <button id="create-button" type="button">Crear registro</button>
      <a class="btn btn-secundario" href="/">Cancelar</a>
    </div>
  </section>
</main>
<footer class="pie-pagina">
  <img src="/logo-mark.svg" alt="" width="29" height="17">
  <span><strong>CIDATA</strong> · Biblioteca — Catálogo en línea</span>
</footer>
<script type="module">
import { api, buildForm, showNotice } from "/app.js";

const collect = buildForm(document.getElementById("form-container"));
document.getElementById("create-button").addEventListener("click", async () => {
  try {
    const created = await api("/api/libros", {
      method: "POST",
      body: JSON.stringify(collect()),
    });
    location.href = "/libro?id=" + encodeURIComponent(created.id);
  } catch (error) {
    showNotice("notice", error.status === 401
      ? "Para crear debes iniciar sesión."
      : error.message, true);
  }
});
</script>
</body>
</html>
